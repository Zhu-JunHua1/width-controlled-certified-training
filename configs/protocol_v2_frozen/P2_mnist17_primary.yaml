name: P2_mnist17_protocol_v2
output_dir: results/protocol_v2_final/P2_mnist17
data:
  dataset: mnist:1,7
  train_size: 100
  calibration_size: 500
  test_size: 500
  seed: 55873755
  calibration_seed: 261026576
  test_seed: 1608498564
  strategy: separate
  split_manifest: data_splits/final_mnist17_protocol_v2.json
model: {hidden_layers: 1, hidden_width: 10}
pretraining:
  enabled: true
  target_accuracy: 0.50
  maximum_initial_accuracy: 0.50
  maximum_final_accuracy: 0.52
  step_size: 0.0002
  maximum_epochs: 8000
  optimizer: adam
training:
  horizon: 30
  base_step: 0.1
  retention: 0.8
  gradient_batch_size: 4
  max_gradient_width: 50.0
  schedule_target_final_step: 0.055974505841732025
  step_decay_milestone_fraction: 0.5
evaluation:
  input_domain: same_as_training
  selection_bound_method: IC
  bound_methods: [IBP, IC]
  test_access: frozen_final
  analysis_tier: primary
  study_lock: study_locks/protocol_v2_frozen.yaml
radii: [0.001]
seed_selection: {start: 0, stop: 50, count: 10}
methods: [IBP, AGT-Hybrid, CROWN, IC, IBP+IWAU, IC+IWAU, IC+GlobalIWAU, IC+InverseTime, IC+Cosine, IC+StepDecay]
echo_epochs: false
