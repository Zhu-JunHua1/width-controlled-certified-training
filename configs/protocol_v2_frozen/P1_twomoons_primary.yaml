name: P1_twomoons_protocol_v2
output_dir: results/protocol_v2_final/P1_twomoons
data:
  dataset: twomoons
  train_size: 100
  calibration_size: 500
  test_size: 500
  seed: 902882306
  calibration_seed: 2783311725
  test_seed: 2788144449
  strategy: separate
model: {hidden_layers: 2, hidden_width: 20}
pretraining:
  enabled: true
  target_accuracy: 0.50
  maximum_initial_accuracy: 0.505
  maximum_final_accuracy: 0.52
  step_size: 0.02
  maximum_epochs: 4000
  optimizer: sgd
training:
  horizon: 40
  base_step: 0.1
  retention: 0.8
  gradient_batch_size: 4
  max_gradient_width: 50.0
  schedule_target_final_step: 0.055974505841732025
  step_decay_milestone_fraction: 0.5
evaluation:
  input_domain: same_as_training
  selection_bound_method: IC
  bound_methods: [IBP, IC]
  test_access: frozen_final
  analysis_tier: primary
  study_lock: study_locks/protocol_v2_frozen.yaml
radii: [0.01]
seed_selection: {start: 0, stop: 25, count: 10}
methods: [IBP, AGT-Hybrid, CROWN, IC, IBP+IWAU, IC+IWAU, IC+GlobalIWAU, IC+InverseTime, IC+Cosine, IC+StepDecay]
echo_epochs: false
