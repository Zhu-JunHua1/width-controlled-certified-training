name: example_twomoons_certified_training
output_dir: results/example_twomoons
data:
  dataset: twomoons
  train_size: 100
  calibration_size: 200
  test_size: 200
  seed: 10123310
  calibration_seed: 314159
  test_seed: 42
model:
  hidden_layers: 1
  hidden_width: 20
pretraining:
  enabled: true
  target_accuracy: 0.50
  maximum_initial_accuracy: 0.50
  step_size: 0.02
  maximum_epochs: 1000
  optimizer: sgd
training:
  horizon: 30
  base_step: 0.1
  retention: 0.95
  gradient_batch_size: 10
evaluation:
  input_domain: same_as_training
radii: [0.01]
seed_selection: {start: 0, stop: 10, count: 1}
methods: [IBP, IC+IWAU]
echo_epochs: true
