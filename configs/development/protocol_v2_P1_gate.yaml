# One-start calibration-only gate for the protocol-v2 P1 data roles.
name: development_protocol_v2_P1_gate
output_dir: results/development_protocol_v2_P1_gate
data:
  dataset: twomoons
  train_size: 100
  calibration_size: 500
  test_size: 500
  seed: 902882306
  calibration_seed: 2783311725
  test_seed: 2788144449
  strategy: separate
model: {hidden_layers: 2, hidden_width: 20}
pretraining:
  enabled: true
  target_accuracy: 0.50
  maximum_initial_accuracy: 0.505
  maximum_final_accuracy: 0.52
  step_size: 0.02
  maximum_epochs: 4000
  optimizer: sgd
training:
  horizon: 5
  base_step: 0.1
  retention: 0.8
  gradient_batch_size: 4
  max_gradient_width: 50.0
evaluation:
  input_domain: same_as_training
  selection_bound_method: IC
  bound_methods: [IBP, IC]
  test_access: disabled
  analysis_tier: development
radii: [0.01]
seed_selection: {start: 0, stop: 1, count: 1}
methods: [IBP, IC, IBP+IWAU, IC+IWAU]
echo_epochs: false

