name: protocol_v5_twomoons_multiradius_smoke
output_dir: results/development/protocol_v5_main_smoke
data:
  dataset: twomoons
  train_size: 8
  calibration_size: 8
  test_size: 8
  seed: 20261011
  calibration_seed: 20261012
  test_seed: 0
  strategy: separate
model: {hidden_layers: 2, hidden_width: 4}
pretraining:
  enabled: false
  target_accuracy: 0.50
  maximum_initial_accuracy: 1.0
  maximum_final_accuracy: 1.0
  step_size: 0.02
  maximum_epochs: 1
  optimizer: sgd
training:
  horizon: 1
  base_step: 0.1
  retention: 0.8
  gradient_batch_size: 4
  max_gradient_width: 50.0
evaluation:
  input_domain: same_as_training
  selection_bound_method: IC
  bound_methods: [IBP, IC]
  test_access: disabled
  analysis_tier: development
radii: [0.0001]
seed_selection: {start: 0, stop: 1, count: 1}
methods: [IBP, IBP+IWAU, IC, IC+IWAU]
echo_epochs: false
