name: development_gradient_bound_ablation_mnist17
output_dir: results/development_gradient_bound_ablation_mnist17
data:
  dataset: mnist:1,7
  train_size: 100
  calibration_size: 500
  test_size: 500
  seed: 10123310
  calibration_seed: 314159
  # Reserved only to keep the dataset schema complete; test access is disabled.
  test_seed: 42
model:
  hidden_layers: 1
  hidden_width: 10
pretraining:
  enabled: true
  target_accuracy: 0.50
  maximum_initial_accuracy: 0.50
  maximum_final_accuracy: 0.52
  step_size: 0.0002
  maximum_epochs: 8000
  optimizer: adam
training:
  horizon: 5
  base_step: 0.1
  retention: 0.8
  gradient_batch_size: 10
  max_gradient_width: 50.0
evaluation:
  input_domain: same_as_training
  selection_bound_method: IC
  bound_methods: [IBP, IC]
  test_access: disabled
radii: [0.001]
seed_selection: {start: 0, stop: 15, count: 1}
methods: [IBP, AGT-Hybrid, CROWN, IC]
echo_epochs: false
