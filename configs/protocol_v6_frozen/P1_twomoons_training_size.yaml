# One-time blind training-size extension. Do not run before the metadata lock
# and independent clean-tree/hash validation are complete.
base:
  name: P1_twomoons_train_size_N100_v6
  output_dir: results/protocol_v6_scale_final/N100
  data:
    dataset: twomoons
    train_size: 100
    calibration_size: 500
    test_size: 500
    seed: 3907119627
    calibration_seed: 3785856782
    test_seed: 785260675
    strategy: nested_train_pool
    training_pool_size: 800
  model: {hidden_layers: 2, hidden_width: 20}
  pretraining:
    enabled: false
    target_accuracy: 0.5
    maximum_initial_accuracy: 1.0
    maximum_final_accuracy: 1.0
    step_size: 0.02
    maximum_epochs: 1
    optimizer: sgd
  training:
    horizon: 40
    base_step: 0.1
    retention: 0.8
    gradient_batch_size: 4
    max_gradient_width: 50.0
  evaluation:
    input_domain: same_as_training
    selection_bound_method: IC
    bound_methods: [IBP, IC]
    test_access: frozen_final
    analysis_tier: secondary
    study_lock: study_locks/protocol_v6_scale_frozen.yaml
  radii: [0.001]
  seed_selection:
    start: 0
    stop: 10
    count: 10
    manifest: study_locks/candidate_audits/protocol_v6_scale_seeds.json
    group: size_scale
  methods: [IBP, IBP+IWAU, IC, IC+IWAU]
  echo_epochs: false
variants:
  - overrides: {}
  - overrides:
      name: P1_twomoons_train_size_N200_v6
      output_dir: results/protocol_v6_scale_final/N200
      data: {train_size: 200}
  - overrides:
      name: P1_twomoons_train_size_N400_v6
      output_dir: results/protocol_v6_scale_final/N400
      data: {train_size: 400}
  - overrides:
      name: P1_twomoons_train_size_N800_v6
      output_dir: results/protocol_v6_scale_final/N800
      data: {train_size: 800}
