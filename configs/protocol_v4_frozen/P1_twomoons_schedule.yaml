name: P1_twomoons_schedule_protocol_v4
output_dir: results/protocol_v4_final/P1_twomoons_schedule
data:
  dataset: twomoons
  train_size: 100
  calibration_size: 500
  test_size: 500
  seed: 2268034632
  calibration_seed: 2931978507
  test_seed: 2695485613
  strategy: separate
model: {hidden_layers: 2, hidden_width: 20}
pretraining:
