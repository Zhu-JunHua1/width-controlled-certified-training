name: P2_mnist17_schedule_protocol_v4
output_dir: results/protocol_v4_final/P2_mnist17_schedule
data:
  dataset: mnist:1,7
  train_size: 100
  calibration_size: 500
  test_size: 500
  seed: 1951381023
  calibration_seed: 1408693209
  test_seed: 1127648377
  strategy: separate
  split_manifest: data_splits/blind_mnist17_protocol_v4.json
model: {hidden_layers: 1, hidden_width: 10}
pretraining:
  enabled: true
  target_accuracy: 0.50
  maximum_initial_accuracy: 0.50
  maximum_final_accuracy: 0.52
  step_size: 0.0002
  maximum_epochs: 8000
  optimizer: adam
training:
  horizon: 30
  base_step: 0.1
  retention: 0.8
  gradient_batch_size: 4
  max_gradient_width: 50.0
  cumulative_target_mean_step: 0.0559918078835364
  tuned_schedule_family: inverse_time
  tuned_schedule_target_final_step: 0.005
  tuned_step_decay_milestone_fraction: 0.5
evaluation:
  input_domain: same_as_training
  selection_bound_method: IC
  bound_methods: [IBP, IC]
  test_access: frozen_final
  analysis_tier: secondary
  study_lock: study_locks/protocol_v4_schedule_frozen.yaml
radii: [0.001]
seed_selection:
  start: 0
  stop: 50
  count: 10
  manifest: study_locks/candidate_audits/protocol_v4_P2_seeds.json
  group: schedule
methods: [IC, IC+IWAU, IC+GlobalIWAU, IC+TunedScalar, IC+CumulativeCosine]
echo_epochs: false
