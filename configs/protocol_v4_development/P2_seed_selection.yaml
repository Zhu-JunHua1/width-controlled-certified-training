name: P2_v4_seed_selection
output_dir: artifacts/development/protocol_v4/P2_seed_selection
data:
  dataset: mnist:1,7
  train_size: 100
  calibration_size: 500
  test_size: 500
  seed: 1951381023
  calibration_seed: 1408693209
  test_seed: 1127648377
  strategy: separate
  split_manifest: data_splits/blind_mnist17_protocol_v4.json
model: {hidden_layers: 1, hidden_width: 10}
pretraining:
  enabled: true
  target_accuracy: 0.50
  maximum_initial_accuracy: 0.50
  maximum_final_accuracy: 0.52
  step_size: 0.0002
  maximum_epochs: 8000
  optimizer: adam
training:
  horizon: 30
  base_step: 0.1
  retention: 0.8
  gradient_batch_size: 4
  max_gradient_width: 50.0
evaluation:
  input_domain: same_as_training
  selection_bound_method: IC
  bound_methods: [IBP, IC]
  test_access: disabled
  analysis_tier: development
radii: [0.001]
seed_selection: {start: 0, stop: 50, count: 10}
methods: [IC]
echo_epochs: false
