base:
  name: P6_mnist17_depth_protocol_v2_base
  output_dir: results/protocol_v2_candidates/P6/base
  data:
    dataset: mnist:1,7
    train_size: 100
    calibration_size: 500
    test_size: 500
    seed: 55873755
    calibration_seed: 261026576
    test_seed: 1608498564
    strategy: separate
    split_manifest: data_splits/final_mnist17_protocol_v2.json
  model: {hidden_layers: 1, hidden_width: 10}
  pretraining:
    enabled: true
    target_accuracy: 0.50
    maximum_initial_accuracy: 0.50
    maximum_final_accuracy: 0.52
    step_size: 0.0002
    optimizer: adam
  training: {horizon: 40, base_step: 0.1, retention: 0.8}
  evaluation:
    input_domain: same_as_training
    selection_bound_method: IC
    bound_methods: [IBP, IC]
    test_access: disabled
    analysis_tier: secondary
  radii: [0.0001, 0.001]
  seed_selection: {start: 0, stop: 150, count: 10}
  methods: [IBP, IC, IC+IWAU]
  echo_epochs: false

variants:
  - overrides: {name: P6_v2_L1, output_dir: results/protocol_v2_candidates/P6/L1, model: {hidden_layers: 1}, seed_selection: {manifest: study_locks/candidate_audits/P6_shared_seeds.json, group: depth}}
  - overrides: {name: P6_v2_L2, output_dir: results/protocol_v2_candidates/P6/L2, model: {hidden_layers: 2}, seed_selection: {manifest: study_locks/candidate_audits/P6_shared_seeds.json, group: depth}}
  - overrides: {name: P6_v2_L3, output_dir: results/protocol_v2_candidates/P6/L3, model: {hidden_layers: 3}, seed_selection: {manifest: study_locks/candidate_audits/P6_shared_seeds.json, group: depth}}
