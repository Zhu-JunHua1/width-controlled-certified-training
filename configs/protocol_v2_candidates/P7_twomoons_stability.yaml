base:
  name: P7_twomoons_stability_protocol_v2_base
  output_dir: results/protocol_v2_candidates/P7/base
  data:
    dataset: twomoons
    train_size: 100
    calibration_size: 500
    test_size: 500
    seed: 902882306
    calibration_seed: 2783311725
    test_seed: 2788144449
    strategy: separate
  model: {hidden_layers: 2, hidden_width: 20}
  pretraining:
    enabled: true
    target_accuracy: 0.50
    maximum_initial_accuracy: 0.505
    maximum_final_accuracy: 0.52
    step_size: 0.02
    optimizer: sgd
  training: {horizon: 40, base_step: 0.1, retention: 0.8}
  evaluation:
    input_domain: same_as_training
    selection_bound_method: IC
    bound_methods: [IBP, IC]
    test_access: disabled
    analysis_tier: secondary
  radii: [0.001]
  seed_selection: {start: 0, stop: 25, count: 10}
  methods: [IC, IC+IWAU]
  echo_epochs: false

variants:
  - overrides: {name: P7_v2_T20, output_dir: results/protocol_v2_candidates/P7/T20, training: {horizon: 20}, seed_selection: {manifest: study_locks/candidate_audits/P7_shared_seeds.json, group: training_length}}
  - overrides: {name: P7_v2_T40, output_dir: results/protocol_v2_candidates/P7/T40, training: {horizon: 40}, seed_selection: {manifest: study_locks/candidate_audits/P7_shared_seeds.json, group: training_length}}
  - overrides: {name: P7_v2_T60, output_dir: results/protocol_v2_candidates/P7/T60, training: {horizon: 60}, seed_selection: {manifest: study_locks/candidate_audits/P7_shared_seeds.json, group: training_length}}
  - overrides: {name: P7_v2_T80, output_dir: results/protocol_v2_candidates/P7/T80, training: {horizon: 80}, seed_selection: {manifest: study_locks/candidate_audits/P7_shared_seeds.json, group: training_length}}
