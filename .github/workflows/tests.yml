name: tests

on:
  push:
  pull_request:

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.8.0 torchvision==0.23.0 --index-url https://download.pytorch.org/whl/cpu
          git -c core.autocrlf=false clone https://github.com/Verified-Intelligence/auto_LiRPA.git ../auto_LiRPA
          git -C ../auto_LiRPA checkout 9d100ec070868440b48d34e2f1dd21b97aab9172
          python tools/prepare_autolirpa.py --source ../auto_LiRPA
          python -m pip install -e ../auto_LiRPA --no-deps
          python -m pip install -e ".[dev]"
          python tools/prepare_autolirpa.py --source ../auto_LiRPA --check-only
      - name: Validate public experiment configurations
        shell: bash
        run: |
          for config in configs/examples/*.yaml configs/paper/*.yaml; do
            width-cert validate-config "$config"
          done
      - name: Run CPU regression tests
        shell: bash
        run: |
          set +e
          python -m pytest -p no:cacheprovider 2>&1 | tee pytest-output.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            message=$(tail -c 3000 pytest-output.log | sed -z 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
            echo "::error title=CPU regression tests failed::$message"
          fi
          exit "$status"
