name: tests

on:
  push:
  pull_request:

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.8.0 torchvision==0.23.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "git+https://github.com/Verified-Intelligence/auto_LiRPA.git@9d100ec070868440b48d34e2f1dd21b97aab9172" --no-deps
          python -m pip install -e ".[dev]"
      - name: Validate public experiment configurations
        shell: bash
        run: |
          for config in configs/examples/*.yaml configs/paper/*.yaml; do
            width-cert validate-config "$config"
          done
      - name: Run CPU regression tests
        run: pytest -p no:cacheprovider
